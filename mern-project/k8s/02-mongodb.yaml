apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-seed
  namespace: mern
data:
  seed.js: |
    db = db.getSiblingDB("sample_training");
    if (db.records.countDocuments() === 0) {
      db.records.insertMany([
        { name: "Ada Lovelace", position: "Backend Engineer", level: "Senior" },
        { name: "Alan Turing", position: "Platform Engineer", level: "Senior" },
        { name: "Grace Hopper", position: "DevOps Engineer", level: "Junior" }
      ]);
    }
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: mern
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: mern
  labels:
    app: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:7
          args: ["--bind_ip_all"]
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mern-secrets
                  key: MONGO_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mern-secrets
                  key: MONGO_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: sample_training
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: seed
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: seed
          configMap:
            name: mongo-seed
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
