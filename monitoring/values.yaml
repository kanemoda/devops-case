grafana:
  adminPassword: changeme-in-production
  defaultDashboardsTimezone: browser
  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    retention: 7d
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["namespace", "alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      receiver: default
      routes:
        - matchers:
            - severity = "critical"
          receiver: critical
    receivers:
      - name: default
      - name: critical
        slack_configs:
          - api_url: https://hooks.slack.com/services/REPLACE/WITH/WEBHOOK
            channel: "#alerts"
            send_resolved: true
            title: "{{ .CommonLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
