apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mern-stack-alerts
  namespace: monitoring
  labels:
    role: alert-rules
spec:
  groups:
    - name: mern-stack.rules
      rules:
        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_status_replicas_available{namespace="mern"} < kube_deployment_spec_replicas{namespace="mern"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
            description: "{{ $labels.deployment }} in {{ $labels.namespace }} has had fewer available replicas than desired for 5 minutes."

        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"mern|etl"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in {{ $labels.pod }} restarted more than 3 times in 15 minutes."

        - alert: MongoDBNotReady
          expr: kube_statefulset_status_replicas_ready{namespace="mern", statefulset="mongodb"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "MongoDB is not ready"
            description: "The MongoDB StatefulSet has no ready replicas, the backend cannot reach the database."

        - alert: ETLJobFailed
          expr: kube_job_status_failed{namespace="etl"} > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "ETL job failed"
            description: "An ETL job in the etl namespace has reported a failure."

        - alert: ETLCronJobNotScheduled
          expr: time() - kube_cronjob_status_last_schedule_time{namespace="etl", cronjob="etl"} > 7200
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ETL CronJob has not run recently"
            description: "The ETL CronJob has not been scheduled in over two hours."

        - alert: ContainerHighMemory
          expr: |
            sum by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~"mern|etl", container!=""})
              / sum by (namespace, pod, container) (kube_pod_container_resource_limits{namespace=~"mern|etl", resource="memory"})
              > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.container }}"
            description: "{{ $labels.pod }}/{{ $labels.container }} is using more than 90% of its memory limit."
